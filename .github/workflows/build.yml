name: Build and GameTests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributable mod
        run: ./gradlew build --console=plain
      - name: Run dedicated-server GameTests
        run: ./gradlew runGameTestServer --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: felox-build-and-logs
          path: |
            build/libs/*.jar
            run-gametest/logs/
          if-no-files-found: ignore
